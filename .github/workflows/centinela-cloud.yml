name: Cloud Guardian 24/7 (EduTrack Quality Gates & AI Code Reviewer)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/30 * * * *'  # Autonomous 30-minute schedule runner on GitHub Actions
  workflow_dispatch:        # Manual trigger in GitHub web

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  audit-and-sync-24-7:
    name: AI Code Review, Quality Gates & Trello Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Runtime Dependencies
        run: |
          pip install requests google-generativeai

      - name: Execute Cloud Audit, AI Review & Governance Verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID || '6aaef11b808b8de50ad9237e' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -f ".github/scripts/centinela_cloud.py" ]; then
            python .github/scripts/centinela_cloud.py
          else
            echo "Notice: Script not found in .github/scripts/centinela_cloud.py."
          fi
